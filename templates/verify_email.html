<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project GURU – Verify Email</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --aston-navy: #002d54;
            --aston-red: #e4003a;
            --aston-grey: #f4f4f4;
        }

        body {
            background-color: var(--aston-grey);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto', Arial, sans-serif;
            /* Radial background pattern to match login/signup */
            background-image: radial-gradient(var(--aston-navy) 0.5px, transparent 0.5px);
            background-size: 30px 30px;
            background-opacity: 0.05;
        }

        .verify-card {
            background: white;
            padding: 40px;
            border-radius: 0; /* Square edges for institutional branding  */
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-top: 5px solid var(--aston-red);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h3 {
            color: var(--aston-navy);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-aston {
            background: var(--aston-red);
            color: white;
            border: none;
            font-weight: 700;
            text-transform: uppercase;
            padding: 12px;
            transition: 0.3s;
            border-radius: 0;
        }

        .btn-aston:hover {
            background: #b3002d;
            color: white;
        }

        .form-control {
            margin-bottom: 15px;
            border-radius: 0;
            padding: 15px;
            border: 1px solid #ced4da;
            text-align: center;
            font-size: 1.5rem;
            letter-spacing: 8px; /* High spacing  */
            font-weight: 700;
            color: var(--aston-navy);
        }

        .form-control:focus {
            border-color: var(--aston-navy);
            box-shadow: none;
        }

        .instruction-text {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            margin-bottom: 25px;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--aston-navy);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .back-link a:hover {
            color: var(--aston-red);
        }
    </style>
</head>

<body>

<div class="verify-card">
    <div class="logo">
        <img src="{{ url_for('static', filename='aston_logo.png') }}" height="60" alt="Aston Logo">
        <h3>Project GURU</h3>
    </div>

    <h4 class="text-center mb-3" style="color: var(--aston-navy); font-weight: 700;">Verify Your Email</h4>
    
    <p class="instruction-text">
        A verification code has been sent to your university email address. Please enter it below.
    </p>

    <form method="POST">
        <div class="mb-3">
            <input
                type="text"
                name="code"
                class="form-control"
                placeholder="000000"
                maxlength="6"
                required
                autocomplete="one-time-code"
            >
        </div>

        <button class="btn btn-aston w-100 mt-2" type="submit">
            Verify Account
        </button>
    </form>

    <div class="back-link">
        <a href="/login">← Back to Login</a>
    </div>
</div>

</body>
</html>

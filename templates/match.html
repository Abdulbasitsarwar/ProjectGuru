<!DOCTYPE html>
<html>

<head>

<title>My Match</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

{% include "navbar.html" %}

<div class="container mt-5">

<h2 class="mb-4">My Match</h2>

{% if match %}

<div class="card shadow mb-4">
<div class="card-body">

<h4>Mentor</h4>

<p><b>Name:</b> {{ mentor.name }}</p>
<p><b>Email:</b> {{ mentor.email }}</p>

</div>
</div>


<div class="card shadow mb-4">
<div class="card-body">

<h4>Mentee</h4>

<p><b>Name:</b> {{ mentee.name }}</p>
<p><b>Email:</b> {{ mentee.email }}</p>

</div>
</div>

{% else %}

<p class="text-muted">
You do not have a confirmed match yet.
</p>

{% endif %}

</div>

</body>
</html>

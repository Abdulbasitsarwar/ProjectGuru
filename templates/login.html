<!DOCTYPE html>
<html>

<head>

<title>Project GURU – Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:linear-gradient(135deg,#4b0082,#6f2da8);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial, Helvetica, sans-serif;
}

.login-card{
background:white;
padding:40px;
border-radius:10px;
width:420px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.logo{
text-align:center;
margin-bottom:20px;
}

.logo h3{
color:#4b0082;
font-weight:700;
}

.btn-purple{
background:#6f2da8;
color:white;
border:none;
}

.btn-purple:hover{
background:#4b0082;
}

.form-control{
margin-bottom:15px;
}

.back-link{
text-align:center;
margin-top:15px;
}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">

<h3>Project GURU</h3>
<p style="font-size:14px;color:gray;">
Aston University Mentoring Scheme
</p>

</div>

<h4 class="text-center mb-4">Login</h4>

<form method="POST">

<input
type="email"
name="email"
class="form-control"
placeholder="University Email"
required
>

<input
type="password"
name="password"
class="form-control"
placeholder="Password"
required
>

<button class="btn btn-purple w-100 mt-3" type="submit">
Login
</button>

</form>

<div class="back-link">

<a href="/" style="color:#6f2da8;">← Back to Home</a>

</div>

</div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project GURU – Change Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --aston-navy: #002d54;
            --aston-red: #e4003a;
            --aston-grey: #f4f4f4;
        }

        body {
            background-color: var(--aston-grey);
            font-family: 'Roboto', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            /* Subtle background pattern to match login/signup */
            background-image: radial-gradient(var(--aston-navy) 0.5px, transparent 0.5px);
            background-size: 30px 30px;
        }

        .password-card {
            background: white;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-top: 5px solid var(--aston-red);
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-section h3 {
            color: var(--aston-navy);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--aston-navy);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .form-control {
            margin-bottom: 20px;
            border-radius: 0;
            padding: 12px;
            border: 1px solid #ced4da;
        }

        .form-control:focus {
            border-color: var(--aston-navy);
            box-shadow: none;
        }

        .btn-aston-red {
            background: var(--aston-red);
            color: white;
            border: none;
            font-weight: 700;
            text-transform: uppercase;
            padding: 12px;
            transition: 0.3s;
            border-radius: 0;
        }

        .btn-aston-red:hover {
            background: #b3002d;
            color: white;
        }

        .btn-aston-outline {
            background: transparent;
            color: var(--aston-navy);
            border: 2px solid var(--aston-navy);
            font-weight: 700;
            text-transform: uppercase;
            padding: 10px;
            transition: 0.3s;
            border-radius: 0;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-aston-outline:hover {
            background: var(--aston-navy);
            color: white;
        }

        .logo-small {
            height: 40px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="password-card">
    <div class="header-section">
        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/6/6b/Aston_University_logo.svg/512px-Aston_University_logo.svg.png" class="logo-small" alt="Aston Logo">
        <h3>Security Settings</h3>
        <p class="text-muted small">Update your account password</p>
    </div>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Current Password</label>
            <input 
                type="password" 
                name="current_password" 
                class="form-control" 
                placeholder="Enter current password" 
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">New Password</label>
            <input 
                type="password" 
                name="new_password" 
                class="form-control" 
                placeholder="Enter new password" 
                required
            >
        </div>

        <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-aston-red">Update Password</button>
            <a href="/dashboard" class="btn btn-aston-outline">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>

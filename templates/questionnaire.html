<!DOCTYPE html>
<html>
<head>
    <title>Mentoring Questionnaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5 mb-5" style="max-width: 800px;">

    <div class="card shadow">
        <div class="card-body">

            <h2 class="mb-4 text-center">Mentoring Profile Questionnaire</h2>

            <form method="POST">

                <!-- ================= SECTION 1 ================= -->
                <h5 class="mb-3">Section 1 — Your Current Role</h5>

                <div class="mb-4">
                    <label class="form-label">What is your current role at Aston University?</label>
                    <select name="level" class="form-select" required>
                        <option value="">Select your role</option>
                        <option value="undergraduate">Undergraduate Student</option>
                        <option value="postgraduate">Postgraduate Student</option>
                        <option value="phd">PhD Researcher</option>
                        <option value="lecturer">Lecturer</option>
                        <option value="research_staff">Research Staff</option>
                        <option value="admin_staff">Administrative Staff</option>
                        <option value="other_staff">Other University Staff</option>
                    </select>
                </div>


                <!-- ================= SECTION 2 ================= -->
                <h5 class="mb-3">Section 2 — Professional Experience</h5>

                <div class="mb-4">
                    <label class="form-label">How many years of professional or academic experience do you have?</label>
                    <select name="experience" class="form-select" required>
                        <option value="">Select experience</option>
                        <option value="0-1">0–1 Years</option>
                        <option value="1-3">1–3 Years</option>
                        <option value="3-5">3–5 Years</option>
                        <option value="5-7">5–7 Years</option>
                        <option value="7-10">7–10 Years</option>
                        <option value="10+">10+ Years</option>
                    </select>
                </div>


                <!-- ================= SECTION 3 ================= -->
                <h5 class="mb-3">Section 3 — Support Areas</h5>

                <label class="form-label">
                    In which areas are you seeking support OR able to provide support?
                </label>

                <div class="row mb-4">

                    <div class="col-md-6">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="help" value="cv">
                            <label class="form-check-label">CV & Applications</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="help" value="placements">
                            <label class="form-check-label">Placements & Internships</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="help" value="career">
                            <label class="form-check-label">Career Guidance</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="help" value="interview">
                            <label class="form-check-label">Interview Preparation</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="help" value="university_life">
                            <label class="form-check-label">Adjusting to University Life</label>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="help" value="research">
                            <label class="form-check-label">Research Support</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="help" value="academic_writing">
                            <label class="form-check-label">Academic Writing</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="help" value="professional_dev">
                            <label class="form-check-label">Professional Development</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="help" value="leadership">
                            <label class="form-check-label">Leadership & Personal Growth</label>
                        </div>
                    </div>

                </div>


                <!-- ================= SECTION 4 ================= -->
                <h5 class="mb-3">Section 4 — Academic / Industry Domain</h5>

                <div class="mb-4">
                    <label class="form-label">Which domain best describes your background?</label>
                    <select name="domain" class="form-select" required>
                        <option value="">Select domain</option>
                        <option value="computer_science">Computer Science</option>
                        <option value="cyber_security">Cyber Security</option>
                        <option value="business">Business & Management</option>
                        <option value="finance">Finance & Accounting</option>
                        <option value="engineering">Engineering</option>
                        <option value="medicine">Medicine</option>
                        <option value="optometry">Optometry</option>
                        <option value="law">Law</option>
                        <option value="psychology">Psychology</option>
                        <option value="other">Other</option>
                    </select>
                </div>


                <!-- ================= SECTION 5 ================= -->
                <h5 class="mb-3">Section 5 — Availability</h5>

                <div class="mb-4">
                    <label class="form-label">When are you generally available?</label>
                    <select name="availability" class="form-select" required>
                        <option value="">Select availability</option>
                        <option value="weekdays">Weekdays</option>
                        <option value="weekends">Weekends</option>
                        <option value="both">Both</option>
                    </select>
                </div>


                <!-- ================= SECTION 6 ================= -->
                <h5 class="mb-3">Section 6 — Preferred Meeting Location</h5>

                <div class="mb-4">
                    <label class="form-label">Where would you prefer mentoring sessions?</label>
                    <select name="location" class="form-select" required>
                        <option value="">Select location</option>
                        <option value="main_building">Aston University Main Building</option>
                        <option value="abs">Aston Business School</option>
                        <option value="library">University Library</option>
                        <option value="flexible">Flexible (Any Location)</option>
                    </select>
                </div>


                <!-- ================= SUBMIT ================= -->
                <div class="text-center">
                    <button type="submit" class="btn btn-primary btn-lg">
                        Submit Profile
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
